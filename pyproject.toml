[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "worldcup"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "rich>=13.0",
    "click>=8.1",
]

[project.optional-dependencies]
dev = ["pytest", "jupyter", "ipykernel"]

[project.scripts]
worldcup = "worldcup.__main__:cli"

[tool.hatch.build.targets.wheel]
packages = ["worldcup"]
